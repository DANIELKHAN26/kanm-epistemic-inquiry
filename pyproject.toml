[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kanm-epistemic-inquiry"
version = "0.11.0"
description = "Bayesian and agent-based models of testimony, source reliability and shared evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Daniel Khan" }]
keywords = ["agent-based-model", "social-epistemology", "Bayesian-inference", "research-software", "testimony", "source-reliability", "value-of-information"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
kanm-run = "kanm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["kanm"]
